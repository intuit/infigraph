name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --title "Infigraph ${{ github.ref_name }}" \
            --generate-notes

  build-driver:
    name: Build Driver JAR
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build infigraph-driver.jar
        run: bash driver/build.sh

      - name: Upload driver artifact
        uses: actions/upload-artifact@v4
        with:
          name: infigraph-driver
          path: driver/infigraph-driver.jar

  build:
    name: Build (${{ matrix.target }})
    needs: [create-release, build-driver]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
            cargo_features: ""
          # Native Intel runner rather than cross-compiling on ARM, so Homebrew
          # has an x86_64 OpenSSL to link.
          - os: macos-15-intel
            target: x86_64-apple-darwin
            archive: tar.gz
            cargo_features: "--no-default-features"
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
            cargo_features: ""
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            archive: tar.gz
            cargo_features: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
            cargo_features: ""
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/share/swift /usr/local/share/powershell /usr/local/share/chromium \
            /usr/local/lib/node_modules /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true
          df -h
      # lbug links `ssl` and `crypto`. Link them statically so the released
      # binaries don't depend on an OpenSSL install on the user's machine:
      # put only the static archives in a directory and point lbug's
      # pkg-config lookup (and the linker) at it.
      # The prebuilt Linux lbug crashes when linked with a newer GCC's cxx bridge.
      - name: Build lbug from source (Linux)
        if: runner.os == 'Linux'
        run: echo "LBUG_BUILD_FROM_SOURCE=1" >> "$GITHUB_ENV"
      - name: Static OpenSSL (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libssl-dev pkg-config zlib1g-dev
          src=$(pkg-config --variable=libdir openssl)
          dir="$RUNNER_TEMP/openssl-static"
          mkdir -p "$dir"
          cp "$src/libssl.a" "$src/libcrypto.a" "$dir/"
          printf 'libdir=%s\nName: OpenSSL\nDescription: static\nVersion: 3\nLibs: -L${libdir} -lssl -lcrypto\n' \
            "$dir" > "$dir/openssl.pc"
          echo "PKG_CONFIG_PATH=$dir" >> "$GITHUB_ENV"
          echo "LIBRARY_PATH=$dir" >> "$GITHUB_ENV"
          echo "OPENSSL_DIR=$dir" >> "$GITHUB_ENV"
          # Newer distro builds of libcrypto.a (Ubuntu 26.04) also pull in zlib
          # and jitterentropy. Link those statically too when it references them.
          # This replaces the target rustflags from .cargo/config.toml, so
          # repeat --allow-multiple-definition here.
          extra=""
          if nm "$dir/libcrypto.a" 2>/dev/null | awk '/ U inflate$/{f=1} END{exit !f}'; then
            cp "$src/libz.a" "$dir/"
            extra="$extra -C link-arg=$dir/libz.a"
          fi
          if nm "$dir/libcrypto.a" 2>/dev/null | awk '/ U jent_/{f=1} END{exit !f}'; then
            apt-cache search jitterentropy
            pkg=$(apt-cache search --names-only jitterentropy | awk '$1 ~ /-dev$/{print $1; exit}')
            echo "jitterentropy dev package: ${pkg:-none}"
            sudo apt-get install -y -qq "$pkg"
            dpkg -L "$pkg"
            cp "$(dpkg -L "$pkg" | awk '/libjitterentropy.*\.a$/{print; exit}')" "$dir/libjitterentropy.a"
            extra="$extra -C link-arg=$dir/libjitterentropy.a"
          fi
          echo "extra static libs:$extra"
          if [ -n "$extra" ]; then
            var="CARGO_TARGET_$(echo '${{ matrix.target }}' | tr 'a-z-' 'A-Z_')_RUSTFLAGS"
            echo "$var=-C link-arg=-Wl,--allow-multiple-definition$extra" >> "$GITHUB_ENV"
          fi
      - name: Static OpenSSL (macOS)
        if: runner.os == 'macOS'
        run: |
          brew list openssl@3 >/dev/null 2>&1 || brew install openssl@3
          src="$(brew --prefix openssl@3)/lib"
          mkdir -p "$RUNNER_TEMP/openssl-static"
          cp "$src/libssl.a" "$src/libcrypto.a" "$RUNNER_TEMP/openssl-static/"
          printf 'libdir=%s\nName: OpenSSL\nDescription: static\nVersion: 3\nLibs: -L${libdir} -lssl -lcrypto\n' \
            "$RUNNER_TEMP/openssl-static" > "$RUNNER_TEMP/openssl-static/openssl.pc"
          echo "PKG_CONFIG_PATH=$RUNNER_TEMP/openssl-static" >> "$GITHUB_ENV"
          echo "LIBRARY_PATH=$RUNNER_TEMP/openssl-static" >> "$GITHUB_ENV"
          # lbug's build script otherwise also searches Homebrew's lib dir,
          # where the dynamic OpenSSL would win.
          echo "OPENSSL_DIR=$RUNNER_TEMP/openssl-static" >> "$GITHUB_ENV"
      - name: Static OpenSSL (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          vcpkg install openssl:x64-windows-static-md
          $root = "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows-static-md"
          $libdir = "$env:RUNNER_TEMP\openssl-static"
          New-Item -ItemType Directory -Force $libdir | Out-Null
          Copy-Item "$root\lib\libssl.lib" "$libdir\libssl.lib"
          Copy-Item "$root\lib\libcrypto.lib" "$libdir\libcrypto.lib"
          "OPENSSL_DIR=$libdir" >> $env:GITHUB_ENV
          # Static OpenSSL needs these system libraries. This replaces the
          # target rustflags from .cargo/config.toml, so repeat /STACK here.
          "CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS=-C link-arg=/STACK:33554432 -C link-arg=crypt32.lib -C link-arg=user32.lib -C link-arg=advapi32.lib -C link-arg=ws2_32.lib" >> $env:GITHUB_ENV

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
          cache-on-failure: true

      - name: Download driver jar
        uses: actions/download-artifact@v4
        with:
          name: infigraph-driver

      - name: Build
        run: cargo build --release --target ${{ matrix.target }} -p infigraph-cli -p infigraph-mcp --features remote ${{ matrix.cargo_features }}

      - name: Dynamic dependencies
        if: always()
        shell: bash
        run: |
          bin=target/${{ matrix.target }}/release
          for exe in infigraph infigraph-mcp; do
            f="$bin/$exe"; [ -f "$f.exe" ] && f="$f.exe"
            echo "== $f"; ls -l "$f" || continue
            case "$RUNNER_OS" in
              macOS) otool -L "$f" ;;
              *) ldd "$f" ;;
            esac
          done
      - name: No dynamic OpenSSL dependency
        shell: bash
        run: |
          bin=target/${{ matrix.target }}/release
          for exe in infigraph infigraph-mcp; do
            f="$bin/$exe"; [ -f "$f.exe" ] && f="$f.exe"
            case "$RUNNER_OS" in
              macOS) deps=$(otool -L "$f") ;;
              *) deps=$(ldd "$f") ;;
            esac
            if echo "$deps" | grep -i -E 'libssl|libcrypto'; then
              echo "::error::$f depends on a dynamic OpenSSL"; exit 1
            fi
          done
      - name: Smoke test (binary starts, opens a graph)
        shell: bash
        run: |
          f=target/${{ matrix.target }}/release/infigraph; [ -f "$f.exe" ] && f="$f.exe"
          "$f" --version
          proj="$RUNNER_TEMP/smoke"; mkdir -p "$proj"
          printf 'def hello():\n    return 1\n' > "$proj/app.py"
          "$f" --root "$proj" index --no-embed
          "$f" --root "$proj" stats
          # `stats` auto-starts a watcher; stop it so it doesn't outlive the step.
          "$f" --root "$proj" watch-stop || true

      - name: Sign (macOS)
        if: runner.os == 'macOS'
        run: |
          codesign --force --deep --sign - target/${{ matrix.target }}/release/infigraph
          codesign --force --deep --sign - target/${{ matrix.target }}/release/infigraph-mcp

      - name: Prepare grammar plugins
        shell: bash
        run: |
          rm -rf grammars_clean && mkdir -p grammars_clean
          for lang in grammars/*/; do
            name=$(basename "$lang")
            mkdir -p "grammars_clean/$name"
            cp "$lang"/*.g4 "grammars_clean/$name/" 2>/dev/null || true
            cp "$lang/plugin.toml" "grammars_clean/$name/" 2>/dev/null || true
          done

      - name: Package (unix)
        if: matrix.archive == 'tar.gz'
        run: |
          cp target/${{ matrix.target }}/release/infigraph .
          cp target/${{ matrix.target }}/release/infigraph-mcp .
          rm -rf grammars && mv grammars_clean grammars
          tar -czf infigraph-${{ matrix.target }}.tar.gz infigraph infigraph-mcp infigraph-driver.jar models/ grammars/
          echo "ASSET=infigraph-${{ matrix.target }}.tar.gz" >> $GITHUB_ENV

      - name: Package (windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          Copy-Item target/${{ matrix.target }}/release/infigraph.exe .
          Copy-Item target/${{ matrix.target }}/release/infigraph-mcp.exe .
          Rename-Item grammars_clean grammars_pkg
          if (Test-Path grammars) { Remove-Item -Recurse grammars }
          Rename-Item grammars_pkg grammars
          Compress-Archive -Path infigraph.exe, infigraph-mcp.exe, infigraph-driver.jar, models/, grammars/ -DestinationPath infigraph-${{ matrix.target }}.zip
          echo "ASSET=infigraph-${{ matrix.target }}.zip" >> $env:GITHUB_ENV

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.ref_name }}" "${{ env.ASSET }}" --clobber --repo "${{ github.repository }}"

  npm-publish:
    name: Publish npm packages
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Download driver jar
        uses: actions/download-artifact@v4
        with:
          name: infigraph-driver

      - name: Download release archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.ref_name }}"
          mkdir -p /tmp/release-assets
          for target in aarch64-apple-darwin x86_64-apple-darwin x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu; do
            gh release download "$TAG" --pattern "infigraph-${target}.tar.gz" --dir /tmp/release-assets --repo "${{ github.repository }}"
          done
          gh release download "$TAG" --pattern "infigraph-x86_64-pc-windows-msvc.zip" --dir /tmp/release-assets --repo "${{ github.repository }}"

      - name: Sync npm versions with tag
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          # Update main package.json
          cd npm
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          # Update optionalDependencies versions
          for platform in darwin-arm64 darwin-x64 linux-x64 linux-arm64 win32-x64; do
            sed -i "s|\"@intuit/infigraph-${platform}\": \".*\"|\"@intuit/infigraph-${platform}\": \"${VERSION}\"|" package.json
          done
          # Update platform package.json versions
          for platform in darwin-arm64 darwin-x64 linux-x64 linux-arm64 win32-x64; do
            cd platforms/${platform}
            npm version "$VERSION" --no-git-tag-version --allow-same-version
            cd ../..
          done

      - name: Pack platform packages
        run: |
          set -euo pipefail

          declare -A PLATFORM_MAP=(
            ["aarch64-apple-darwin"]="darwin-arm64"
            ["x86_64-apple-darwin"]="darwin-x64"
            ["x86_64-unknown-linux-gnu"]="linux-x64"
            ["aarch64-unknown-linux-gnu"]="linux-arm64"
            ["x86_64-pc-windows-msvc"]="win32-x64"
          )

          for target in "${!PLATFORM_MAP[@]}"; do
            platform="${PLATFORM_MAP[$target]}"
            dest="npm/platforms/${platform}/bin"
            rm -rf "$dest"
            mkdir -p "$dest"

            if [[ "$target" == *windows* ]]; then
              tmpdir=$(mktemp -d)
              unzip -o "/tmp/release-assets/infigraph-${target}.zip" -d "$tmpdir"
              cp "$tmpdir"/infigraph.exe "$dest/"
              cp "$tmpdir"/infigraph-mcp.exe "$dest/"
              [ -f "$tmpdir/infigraph-driver.jar" ] && cp "$tmpdir/infigraph-driver.jar" "$dest/"
              [ -d "$tmpdir/grammars" ] && cp -r "$tmpdir/grammars" "$dest/"
              [ -d "$tmpdir/models" ] && cp -r "$tmpdir/models" "$dest/"
              rm -rf "$tmpdir"
            else
              tar -xzf "/tmp/release-assets/infigraph-${target}.tar.gz" -C "$dest"
            fi

            # Driver jar from artifact (same for all platforms)
            [ -f infigraph-driver.jar ] && cp infigraph-driver.jar "$dest/"
          done

      - name: Publish platform packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          for platform in darwin-arm64 darwin-x64 linux-x64 linux-arm64 win32-x64; do
            cd npm/platforms/${platform}
            npm publish --access public || echo "Platform ${platform} publish failed (may already exist)"
            cd "${{ github.workspace }}"
          done

      - name: Publish main package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        working-directory: npm
        run: npm publish --access public
