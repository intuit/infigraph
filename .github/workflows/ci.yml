name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/share/swift /usr/local/share/powershell /usr/local/share/chromium \
            /usr/local/lib/node_modules /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true
          df -h
      # lbug's prebuilt Linux lib was built with an older GCC; linking it with
      # the runner's GCC 15 cxx bridge mixes std::format ABIs and segfaults in
      # Database::new. Build lbug's C++ with the same compiler instead.
      - name: Build lbug from source (Ubuntu)
        if: runner.os == 'Linux'
        run: echo "LBUG_BUILD_FROM_SOURCE=1" >> "$GITHUB_ENV"
      # lbug's static lib links `ssl`/`crypto` (lbug build.rs, static mode).
      - name: Link OpenSSL (macOS)
        if: runner.os == 'macOS'
        run: |
          brew list openssl@3 >/dev/null 2>&1 || brew install openssl@3
          echo "LIBRARY_PATH=$(brew --prefix openssl@3)/lib" >> "$GITHUB_ENV"
      - name: Link OpenSSL (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          vcpkg install openssl:x64-windows
          $root = "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows"
          # OpenSSL 3 ships libssl.lib/libcrypto.lib; lbug asks the linker for ssl.lib/crypto.lib.
          $libdir = "$env:RUNNER_TEMP\openssl-lib"
          New-Item -ItemType Directory -Force $libdir | Out-Null
          Copy-Item "$root\lib\libssl.lib" "$libdir\ssl.lib"
          Copy-Item "$root\lib\libcrypto.lib" "$libdir\crypto.lib"
          "LIB=$libdir;$env:LIB" >> $env:GITHUB_ENV
          "$root\bin" >> $env:GITHUB_PATH
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: ci-${{ matrix.os }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test --all
