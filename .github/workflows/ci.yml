name: CI

# TEMPORARY debug workflow (draft PR, do not merge): capture native backtraces
# for the SIGSEGVs seen on #90/#91.
on:
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: full

jobs:
  segv:
    name: SIGSEGV (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            pkg: infigraph-mcp
            target: --test concurrent_writer_reader
          - os: ubuntu-latest
            pkg: infigraph-cli
            target: --bin infigraph
    steps:
      - uses: actions/checkout@v4
      - name: Link OpenSSL (macOS)
        if: runner.os == 'macOS'
        run: |
          brew list openssl@3 >/dev/null 2>&1 || brew install openssl@3
          echo "LIBRARY_PATH=$(brew --prefix openssl@3)/lib" >> "$GITHUB_ENV"
      - name: Install gdb (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq gdb
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ci-${{ matrix.os }}
          save-if: false
      - name: Build test binary
        run: |
          cargo test -p ${{ matrix.pkg }} ${{ matrix.target }} --no-run --message-format=json \
            | jq -r 'select(.executable != null) | .executable' | tail -1 > test-bin.txt
          echo "TEST_BIN=$(cat test-bin.txt)" >> "$GITHUB_ENV"
          cat test-bin.txt
      - name: Run (macOS, 8 attempts under lldb)
        if: runner.os == 'macOS'
        run: |
          for i in 1 2 3 4 5 6 7 8; do
            echo "=== attempt $i"
            lldb --batch -o run -k "thread backtrace all" -k quit -- "$TEST_BIN" --nocapture 2>&1 | tee attempt.log
            if grep -q "stop reason = EXC_BAD_ACCESS\|stop reason = signal SIGSEGV" attempt.log; then
              echo "=== CRASH CAPTURED on attempt $i"; exit 1
            fi
          done
          echo "=== no crash in 8 attempts"
      - name: Run (Ubuntu, default threads under gdb)
        if: runner.os == 'Linux'
        run: |
          gdb -batch -ex run -ex "thread apply all bt" --args "$TEST_BIN" 2>&1 | tail -400 | tee run-parallel.log
          grep -q "SIGSEGV" run-parallel.log && echo "=== CRASH CAPTURED (parallel)" || echo "=== no crash (parallel)"
      - name: Run (Ubuntu, --test-threads=1 under gdb)
        if: always() && runner.os == 'Linux'
        run: |
          gdb -batch -ex run -ex "thread apply all bt" --args "$TEST_BIN" --test-threads=1 2>&1 | tail -400 | tee run-serial.log
          grep -q "SIGSEGV" run-serial.log && echo "=== CRASH CAPTURED (serial)" || echo "=== no crash (serial)"
