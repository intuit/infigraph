name: CI

# TEMPORARY debug workflow (draft PR, do not merge): diagnose the Ubuntu
# SIGSEGV in lbug::Database::initBufferManager -> std::vformat.
on:
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: full

jobs:
  facts:
    name: Ubuntu toolchain facts + duplicate symbols
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ci-ubuntu-latest
          save-if: false
      - name: Toolchain facts
        run: |
          set -x
          cat /etc/os-release | head -3
          gcc --version | head -1; g++ --version | head -1; c++ --version | head -1
          ls /usr/include/c++/
          ls -l /usr/bin/g++ /etc/alternatives/c++ 2>&1 || true
          strings -a /usr/lib/x86_64-linux-gnu/libstdc++.so.6 | grep -E '^GLIBCXX_3\.4\.[0-9]+$' | sort -V | tail -2
      - name: Fetch prebuilt lbug (build once with default flags)
        run: cargo build -p infigraph-core --lib
      - name: Prebuilt lbug compiler stamp
        run: |
          for a in $(find ~/.cargo/registry/src -path '*lbug-0.19.1/.cache*' -name '*.a'); do
            echo "== $a"; strings -a "$a" | grep -oE 'GCC: \([^)]*\) [0-9.]+' | sort | uniq -c
          done
      - name: Link WITHOUT --allow-multiple-definition (list duplicate symbols)
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: ""
        run: |
          cargo test -p infigraph-cli --bin infigraph --no-run 2>&1 \
            | grep -E 'multiple definition|first defined here|error:' | sed 's/^.*: //' | sort | uniq -c | sort -rn | head -60 || true

  from-source:
    name: Ubuntu with lbug built from source
    runs-on: ubuntu-latest
    env:
      LBUG_BUILD_FROM_SOURCE: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: debug-lbug-from-source
      - name: Build CLI test binary (lbug from source)
        run: cargo test -p infigraph-cli --bin infigraph --no-run
      - name: Run CLI unit tests
        run: cargo test -p infigraph-cli --bin infigraph
