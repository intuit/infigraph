name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'blog/**']
  pull_request:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'blog/**']

# A newer push to the same PR supersedes the run in progress. Runs on main
# are never cancelled: each merge gets a result, and main saves the caches.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # Full debuginfo dominates test link time; line tables keep file:line in backtraces.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  # The test suite is split into three shards per OS so they run in parallel;
  # one job running `cargo test --all` took about an hour.
  check:
    name: Check (${{ matrix.os }}, ${{ matrix.shard.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
        shard:
          - name: core
            test: -p infigraph-core
          - name: mcp
            test: -p infigraph-mcp
          # Everything else; this shard also runs Clippy and saves the build cache.
          - name: rest
            test: --workspace --exclude infigraph-core --exclude infigraph-mcp
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/share/swift /usr/local/share/powershell /usr/local/share/chromium \
            /usr/local/lib/node_modules /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true
          df -h
      # lbug's prebuilt Linux lib was built with an older GCC; linking it with
      # the runner's GCC 15 cxx bridge mixes std::format ABIs and segfaults in
      # Database::new. Build lbug's C++ with the same compiler instead.
      - name: Build lbug from source (Ubuntu)
        if: runner.os == 'Linux'
        run: echo "LBUG_BUILD_FROM_SOURCE=1" >> "$GITHUB_ENV"
      # lbug's static lib links `ssl`/`crypto` (lbug build.rs, static mode).
      - name: Link OpenSSL (macOS)
        if: runner.os == 'macOS'
        run: |
          brew list openssl@3 >/dev/null 2>&1 || brew install openssl@3
          echo "LIBRARY_PATH=$(brew --prefix openssl@3)/lib" >> "$GITHUB_ENV"
      # vcpkg builds OpenSSL from source (~10 min); reuse the installed tree.
      - name: Cache vcpkg OpenSSL (Windows)
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: C:\vcpkg\installed
          key: vcpkg-openssl-x64-windows-v1
      - name: Link OpenSSL (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          vcpkg install openssl:x64-windows
          $root = "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows"
          # OpenSSL 3 ships libssl.lib/libcrypto.lib; lbug asks the linker for ssl.lib/crypto.lib.
          $libdir = "$env:RUNNER_TEMP\openssl-lib"
          New-Item -ItemType Directory -Force $libdir | Out-Null
          Copy-Item "$root\lib\libssl.lib" "$libdir\ssl.lib"
          Copy-Item "$root\lib\libcrypto.lib" "$libdir\crypto.lib"
          "LIB=$libdir;$env:LIB" >> $env:GITHUB_ENV
          "$root\bin" >> $env:GITHUB_PATH
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: ci-${{ matrix.os }}
          # All shards restore the same cache; only one saves it, so three
          # copies don't push the repo past GitHub's cache quota.
          save-if: ${{ github.ref == 'refs/heads/main' && matrix.shard.name == 'rest' }}
          cache-on-failure: true
      - name: Clippy
        if: matrix.shard.name == 'rest'
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test ${{ matrix.shard.test }}
